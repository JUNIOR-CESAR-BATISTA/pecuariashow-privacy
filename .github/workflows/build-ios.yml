name: Build iOS

# Roda a cada push nas branches de trabalho e também pelo botão manual,
# num computador macOS do próprio GitHub. Repositório público: sem custo.
on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar e testar
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Escolher o Xcode mais novo do runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Nenhum Xcode encontrado no runner."
            exit 1
          fi
          echo "Xcode escolhido: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Escolher um iPhone no simulador
        id: simulador
        run: |
          LINHA=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | tail -1)
          UDID=$(echo "$LINHA" | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -1)
          if [ -z "$UDID" ]; then
            echo "Nenhum iPhone disponível no runner. Simuladores encontrados:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulador: $LINHA"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project NovilhaNutri.xcodeproj \
            -scheme NovilhaNutri \
            -destination "id=${{ steps.simulador.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Rodar os testes
        run: |
          set -o pipefail
          xcodebuild test \
            -project NovilhaNutri.xcodeproj \
            -scheme NovilhaNutri \
            -destination "id=${{ steps.simulador.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Resumir os problemas na página do run
        if: always()
        run: |
          {
            echo "## Erros"
            echo '```'
            cat build.log test.log 2>/dev/null | grep -E "error:|error " | sort -u | head -60 || true
            echo '```'
            echo "## Testes que falharam"
            echo '```'
            cat test.log 2>/dev/null | grep -E "failed|XCTAssert" | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os logs completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-do-build
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 14
