name: TestFlight

# Gera a build assinada e envia para o TestFlight, sem precisar de Mac.
# Dispara ao publicar uma tag "v..." (pelo site do GitHub, em Releases) ou
# pelo botão manual quando o workflow estiver na branch padrão.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão exibida no TestFlight (ex.: 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"
      - "V*"

jobs:
  testflight:
    name: Enviar para o TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Conferir e limpar os segredos
        env:
          CHAVE_ID_BRUTO: ${{ secrets.APPSTORE_KEY_ID }}
          EMISSOR_BRUTO: ${{ secrets.APPSTORE_ISSUER_ID }}
          TIME_BRUTO: ${{ secrets.APPLE_TEAM_ID }}
          CHAVE: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # Espaços e quebras de linha coladas junto do valor quebram tudo
          # mais adiante, então os identificadores são limpos aqui.
          CHAVE_ID=$(printf '%s' "$CHAVE_ID_BRUTO" | tr -d '[:space:]')
          EMISSOR=$(printf '%s' "$EMISSOR_BRUTO" | tr -d '[:space:]')
          TIME=$(printf '%s' "$TIME_BRUTO" | tr -d '[:space:]')

          erros=""
          if ! printf '%s' "$CHAVE_ID" | grep -qE '^[A-Za-z0-9]{10}$'; then
            erros="$erros%0A- APPSTORE_KEY_ID: precisa ser o Key ID da chave, 10 letras e números, algo como 2X9R4KJ8AB. Está com ${#CHAVE_ID} caracteres."
          fi
          if ! printf '%s' "$EMISSOR" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            erros="$erros%0A- APPSTORE_ISSUER_ID: precisa ser o Issuer ID, um UUID com traços, algo como 69a6de70-1a2b-47e3-e053-5b8c7c11a4d1. Está com ${#EMISSOR} caracteres."
          fi
          if ! printf '%s' "$TIME" | grep -qE '^[A-Za-z0-9]{10}$'; then
            erros="$erros%0A- APPLE_TEAM_ID: precisa ser o Team ID, 10 letras e números, algo como A1B2C3D4E5. Está com ${#TIME} caracteres."
          fi
          if ! printf '%s' "$CHAVE" | grep -q 'BEGIN PRIVATE KEY'; then
            erros="$erros%0A- APPSTORE_PRIVATE_KEY: precisa ser o conteúdo inteiro do arquivo AuthKey_XXXXXXXXXX.p8, começando com -----BEGIN PRIVATE KEY-----."
          fi
          if [ -n "$erros" ]; then
            echo "::error::Os segredos abaixo não estão com o valor certo:$erros"
            echo "Nenhum valor é exibido aqui por segurança, só o tamanho."
            exit 1
          fi
          echo "Os quatro segredos estão no formato esperado."

          {
            echo "CHAVE_ID=$CHAVE_ID"
            echo "EMISSOR=$EMISSOR"
            echo "TIME=$TIME"
            echo "CHAVE_ARQUIVO=$HOME/private_keys/AuthKey_$CHAVE_ID.p8"
          } >> "$GITHUB_ENV"
          exit 0

      - name: Escolher o Xcode mais novo do runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Definir a versão da build
        id: versao
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSAO="${GITHUB_REF_NAME}"
            VERSAO="${VERSAO#[vV]}"   # tira o v ou V da frente
            VERSAO="${VERSAO#.}"      # tira um ponto logo em seguida
          else
            VERSAO="${{ github.event.inputs.versao }}"
          fi
          if ! echo "$VERSAO" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::warning::A tag '${GITHUB_REF_NAME}' não vira uma versão válida para a Apple. Usando 1.0.0."
            VERSAO="1.0.0"
          fi
          echo "Versão $VERSAO, build ${GITHUB_RUN_NUMBER}"
          echo "marketing=$VERSAO" >> "$GITHUB_OUTPUT"

      - name: Guardar a chave do App Store Connect
        env:
          CHAVE: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          # tr remove o retorno de carro que vem quando o .p8 é colado no Windows
          printf '%s\n' "$CHAVE" | tr -d '\r' > "$CHAVE_ARQUIVO"
          chmod 600 "$CHAVE_ARQUIVO"
          cp "$CHAVE_ARQUIVO" "$HOME/.appstoreconnect/private_keys/"
          if ! grep -q "BEGIN PRIVATE KEY" "$CHAVE_ARQUIVO"; then
            echo "::error::A chave .p8 parece incompleta. Cole o arquivo inteiro no segredo, incluindo as linhas BEGIN e END."
            exit 1
          fi
          echo "Chave gravada em $CHAVE_ARQUIVO ($(wc -l < "$CHAVE_ARQUIVO") linhas)."

      - name: Arquivar o aplicativo
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NovilhaNutri.xcodeproj \
            -scheme NovilhaNutri \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NovilhaNutri.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CHAVE_ARQUIVO" \
            -authenticationKeyID "$CHAVE_ID" \
            -authenticationKeyIssuerID "$EMISSOR" \
            DEVELOPMENT_TEAM="$TIME" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.versao.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            2>&1 | tee archive.log

      - name: Exportar e enviar para o App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TIME}</string>
            <key>destination</key>
            <string>upload</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NovilhaNutri.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CHAVE_ARQUIVO" \
            -authenticationKeyID "$CHAVE_ID" \
            -authenticationKeyIssuerID "$EMISSOR" \
            2>&1 | tee export.log

      - name: Resumir na página do run
        if: always()
        run: |
          {
            echo "## Envio para o TestFlight"
            echo "- Versão: ${{ steps.versao.outputs.marketing }}"
            echo "- Build: ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "### Erros"
            echo '```'
            cat archive.log export.log 2>/dev/null | grep -E "error:|error |Error Domain|\*\* .* FAILED \*\*" | sort -u | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-testflight
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 14
